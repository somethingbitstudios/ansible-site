
---
- name: Manage users and SSH keys
  hosts: all
  become: true

  tasks:
    - name: Check if user exists
      ansible.builtin.user:
        name: "{{ user_name }}"
        state: present

    - name: Check SSH keys
      ansible.posix.authorized_key:
        user: "{{ user_name }}"
        key: "{{ user_ssh_keys | join('\n') }}"
        state: present
        exclusive: true

